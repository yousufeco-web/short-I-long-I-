<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/sh/ and /s/ Sound Sorting</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f7f9fa;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .instructions {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 20px;
        }

        .board {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .drop-zone {
            width: 300px;
            min-height: 400px;
            background-color: white;
            border: 4px solid #333;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        /* Teal for /sh/ */
        #sound-sh {
            border-color: #246b73;
            background-color: #c9e4e6;
        }
        
        /* Orange/Salmon for /s/ */
        #sound-s {
            border-color: #d67963;
            background-color: #f7d2c6;
        }

        .drop-zone h2 {
            font-size: 2em;
            margin: 10px 0 5px 0;
        }

        #sound-sh h2 { color: #246b73; }
        #sound-s h2 { color: #d67963; }

        .drop-zone p {
            margin: 0 0 20px 0;
            font-size: 1.2em;
            color: #444;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
            width: 80%;
        }

        .dropped-items {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
            min-height: 200px;
        }

        .item-bank {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            min-height: 120px;
            padding: 20px;
            border: 3px dashed #aaa;
            border-radius: 20px;
            background-color: #fff;
            max-width: 800px;
            margin: 0 auto;
        }

        .draggable {
            width: 110px;
            height: 110px;
            background-color: white;
            border: 2px dashed #888;
            border-radius: 10px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .draggable:active {
            cursor: grabbing;
        }

        .draggable span.emoji {
            font-size: 3em; /* Make the emoji big like a picture */
            pointer-events: none;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake 0.5s;
            border-color: red !important;
            background-color: #ffe6e6;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .pop {
            animation: pop 0.5s;
            border-color: #4CAF50 !important;
            border-style: solid;
            background-color: #e6ffe6;
        }

        .controls {
            margin-top: 30px;
            display: none; /* Hidden until puzzle is solved */
            justify-content: center;
            gap: 20px;
            flex-direction: column;
            align-items: center;
        }

        .congrats {
            color: #4CAF50;
            font-size: 2em;
            font-weight: bold;
            margin: 0;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.5em;
            font-family: inherit;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            background-color: #4CAF50;
        }

        .btn:hover {
            transform: scale(1.05);
        }

    </style>
</head>
<body>

    <h1 id="level-title">Sorting: /sh/ and /s/ Sounds</h1>
    <p class="instructions">Drag and drop the pictures into the correct column!</p>

    <div class="board">
        <div class="drop-zone" id="sound-sh" data-target="sh">
            <h2>/sh/ sound</h2>
            <p>Words starting with<br>the /sh/ sound</p>
            <div class="dropped-items"></div>
        </div>

        <div class="drop-zone" id="sound-s" data-target="s">
            <h2>/s/ sound</h2>
            <p>Words starting with<br>the /s/ sound</p>
            <div class="dropped-items"></div>
        </div>
    </div>

    <div class="item-bank" id="item-bank">
        <div class="draggable" draggable="true" id="item-ship" data-target="sh">
            <span class="emoji">🚢</span> Ship
        </div>
        <div class="draggable" draggable="true" id="item-shoe" data-target="sh">
            <span class="emoji">👟</span> Shoe
        </div>
        <div class="draggable" draggable="true" id="item-shell" data-target="sh">
            <span class="emoji">🐚</span> Shell
        </div>
        
        <div class="draggable" draggable="true" id="item-sun" data-target="s">
            <span class="emoji">☀️</span> Sun
        </div>
        <div class="draggable" draggable="true" id="item-sock" data-target="s">
            <span class="emoji">🧦</span> Sock
        </div>
        <div class="draggable" draggable="true" id="item-star" data-target="s">
            <span class="emoji">⭐</span> Star
        </div>
    </div>

    <div class="controls" id="controls">
        <p class="congrats">Great job! You sorted them all!</p>
        <button class="btn" id="play-again" onclick="resetGame()">Play Again 🔄</button>
    </div>

    <script>
        const itemBank = document.getElementById('item-bank');
        const dropZones = document.querySelectorAll('.drop-zone');
        const draggables = document.querySelectorAll('.draggable');
        const controlsDiv = document.getElementById('controls');
        
        let correctlyPlaced = 0;
        const totalItems = draggables.length;

        // 1. Setup Draggable Items
        draggables.forEach(draggable => {
            draggable.addEventListener('dragstart', (e) => {
                // Store the ID of the dragged item
                e.dataTransfer.setData('text/plain', draggable.id);
                // Remove animation classes if they exist
                draggable.classList.remove('shake', 'pop'); 
            });
        });

        // 2. Setup Drop Zones
        dropZones.forEach(zone => {
            // Allow items to be dropped here
            zone.addEventListener('dragover', (e) => {
                e.preventDefault(); 
            });

            // Handle the drop event
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                const draggableId = e.dataTransfer.getData('text/plain');
                if (!draggableId) return;

                const draggableElement = document.getElementById(draggableId);
                const itemType = draggableElement.getAttribute('data-target');
                const zoneType = zone.getAttribute('data-target');

                // Check if they match
                if (itemType === zoneType) {
                    // Correct! Move to drop zone
                    zone.querySelector('.dropped-items').appendChild(draggableElement);
                    draggableElement.classList.add('pop');
                    draggableElement.setAttribute('draggable', 'false'); // Lock it in place
                    draggableElement.style.cursor = 'default';
                    correctlyPlaced++;
                    checkWin();
                } else {
                    // Incorrect! Shake and bounce back
                    draggableElement.classList.add('shake');
                    setTimeout(() => {
                        draggableElement.classList.remove('shake');
                    }, 500);
                }
            });
        });

        // 3. Check for Game Completion
        function checkWin() {
            if (correctlyPlaced === totalItems) {
                setTimeout(() => {
                    controlsDiv.style.display = "flex";
                }, 500);
            }
        }

        // 4. Reset Game Function
        function resetGame() {
            // Move all items back to the bank
            draggables.forEach(draggable => {
                itemBank.appendChild(draggable);
                draggable.setAttribute('draggable', 'true');
                draggable.style.cursor = 'grab';
                draggable.classList.remove('pop', 'shake');
            });
            
            // Shuffle the items randomly in the bank
            for (let i = itemBank.children.length; i >= 0; i--) {
                itemBank.appendChild(itemBank.children[Math.random() * i | 0]);
            }

            // Reset variables and hide controls
            correctlyPlaced = 0;
            controlsDiv.style.display = 'none';
        }

        // Shuffle items on page load
        resetGame();
    </script>
</body>
</html>
