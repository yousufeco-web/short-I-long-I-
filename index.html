<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/ch/ and /c/ Sound Sorting</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f7f9fa;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .instructions {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 20px;
        }

        .board {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
        }

        .drop-zone {
            width: 300px;
            min-height: 400px;
            background-color: white;
            border: 4px solid #333;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        #sound-ch {
            border-color: #246b73;
            background-color: #c9e4e6;
        }
        
        #sound-c {
            border-color: #d67963;
            background-color: #f7d2c6;
        }

        .drop-zone h2 {
            font-size: 2em;
            margin: 10px 0 5px 0;
        }

        #sound-ch h2 { color: #246b73; }
        #sound-c h2 { color: #d67963; }

        .drop-zone p {
            margin: 0 0 20px 0;
            font-size: 1.2em;
            color: #444;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
            width: 80%;
        }

        .dropped-items {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .item-bank {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            min-height: 120px;
            padding: 20px;
            border: 3px dashed #aaa;
            border-radius: 20px;
            background-color: #fff;
            max-width: 800px;
            margin: 0 auto;
        }

        .draggable {
            width: 110px;
            height: 110px; /* Adjusted height since text is removed */
            background-color: white;
            border: 2px dashed #888;
            border-radius: 10px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .draggable:active {
            cursor: grabbing;
        }

        .draggable img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            pointer-events: none; 
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake 0.5s;
            border-color: red !important;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .pop {
            animation: pop 0.5s;
            border-color: #4CAF50 !important;
            border-style: solid;
        }

        .controls {
            margin-top: 30px;
            display: none; /* Hidden until puzzle is solved */
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.5em;
            font-family: inherit;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        #play-again { background-color: #4CAF50; }
        #next-page { background-color: #2196F3; }

    </style>
</head>
<body>

    <h1 id="level-title">Sorting: /ch/ and /c/ Sounds</h1>
    <p class="instructions">Click a picture to hear the word. Drag and drop the pictures into the correct column!</p>

    <div class="board">
        <div class="drop-zone" id="sound-ch" data-target="ch">
            <h2>/ch/ sound</h2>
            <p>Words starting with<br>the /ch/ sound</p>
            <div class="dropped-items"></div>
        </div>

        <div class="drop-zone" id="sound-c" data-target="c">
            <h2>/c/ sound</h2>
            <p>Words starting with<br>the /c/ sound</p>
            <div class="dropped-items"></div>
        </div>
    </div>

    <div class="item-bank" id="item-bank">
        </div>

    <div class="controls" id="controls">
        <button class="btn" id="play-again" onclick="resetCurrentLevel()">Play Again!</button>
        <button class="btn" id="next-page" onclick="loadNextLevel()">Next Page ➡️</button>
    </div>

    <script>
        const itemBank = document.getElementById('item-bank');
        const dropZones = document.querySelectorAll('.drop-zone');
        const controlsDiv = document.getElementById('controls');
        const nextBtn = document.getElementById('next-page');
        const levelTitle = document.getElementById('level-title');

        // Define the levels and their items
        const levels = [
            [ // Level 1 (Original)
                { id: 'chair', word: 'chair', type: 'ch', img: 'https://img.icons8.com/color/96/000000/chair.png' },
                { id: 'cat', word: 'cat', type: 'c', img: 'https://img.icons8.com/color/96/000000/cat.png' },
                { id: 'cheese', word: 'cheese', type: 'ch', img: 'https://img.icons8.com/color/96/000000/cheese.png' },
                { id: 'car', word: 'car', type: 'c', img: 'https://img.icons8.com/color/96/000000/car--v1.png' },
                { id: 'chick', word: 'chick', type: 'ch', img: 'https://api.iconify.design/noto:front-facing-baby-chick.svg' },
                { id: 'cup', word: 'cup', type: 'c', img: 'https://api.iconify.design/noto:teacup-without-handle.svg' }
            ],
            [ // Level 2 (New Words)
                { id: 'chips', word: 'chips', type: 'ch', img: 'https://img.icons8.com/color/96/000000/potato-chips.png' },
                { id: 'cow', word: 'cow', type: 'c', img: 'https://img.icons8.com/color/96/000000/cow.png' },
                { id: 'church', word: 'church', type: 'ch', img: 'https://img.icons8.com/color/96/000000/church.png' },
                { id: 'cake', word: 'cake', type: 'c', img: 'https://img.icons8.com/color/96/000000/cake.png' },
                { id: 'chipmunk', word: 'chipmunk', type: 'ch', img: 'https://api.iconify.design/noto:chipmunk.svg' },
                { id: 'clock', word: 'clock', type: 'c', img: 'https://img.icons8.com/color/96/000000/clock--v1.png' }
            ]
        ];

        let currentLevel = 0;
        let totalItems = 0;
        let correctlyPlaced = 0;

        // --- Audio Setup ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playWrongSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }

        function speakWord(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9; 
            utterance.pitch = 1.2; 
            window.speechSynthesis.speak(utterance);
        }

        // --- Game Setup Logic ---
        function loadLevel(levelIndex) {
            itemBank.innerHTML = '';
            document.querySelectorAll('.dropped-items').forEach(zone => zone.innerHTML = '');
            controlsDiv.style.display = 'none';
            correctlyPlaced = 0;

            const levelData = levels[levelIndex];
            totalItems = levelData.length;
            levelTitle.innerText = `Sorting: /ch/ and /c/ Sounds (Page ${levelIndex + 1})`;

            // Toggle Next Page button visibility based on level
            nextBtn.style.display = (levelIndex < levels.length - 1) ? 'inline-block' : 'none';

            // Generate items
            levelData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'draggable';
                div.draggable = true;
                div.id = 'item-' + item.id;
                div.setAttribute('data-type', item.type);
                div.setAttribute('data-word', item.word); // Storing the word for TTS

                const img = document.createElement('img');
                img.src = item.img;
                img.alt = item.word;

                div.appendChild(img);
                itemBank.appendChild(div);

                // Add Event Listeners to new element
                div.addEventListener('click', () => {
                    speakWord(div.getAttribute('data-word'));
                });

                div.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', div.id);
                    div.classList.remove('shake', 'pop'); 
                });
            });

            // Randomize items in the bank
            for (let i = itemBank.children.length; i >= 0; i--) {
                itemBank.appendChild(itemBank.children[Math.random() * i | 0]);
            }
        }

        // --- Drag and Drop Logic ---
        dropZones.forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault(); 
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                const draggableId = e.dataTransfer.getData('text/plain');
                if (!draggableId) return;

                const draggableElement = document.getElementById(draggableId);
                const itemType = draggableElement.getAttribute('data-type');
                const zoneType = zone.getAttribute('data-target');

                if (itemType === zoneType) {
                    speakWord("Correct!");
                    zone.querySelector('.dropped-items').appendChild(draggableElement);
                    draggableElement.classList.add('pop');
                    draggableElement.setAttribute('draggable', 'false'); 
                    correctlyPlaced++;
                    checkWin();
                } else {
                    playWrongSound();
                    draggableElement.classList.add('shake');
                    setTimeout(() => {
                        draggableElement.classList.remove('shake');
                    }, 500);
                }
            });
        });

        function checkWin() {
            if (correctlyPlaced === totalItems) {
                setTimeout(() => {
                    speakWord("Great job! You sorted all the pictures!");
                    controlsDiv.style.display = "flex";
                }, 1000);
            }
        }

        function resetCurrentLevel() {
            loadLevel(currentLevel);
        }

        function loadNextLevel() {
            if (currentLevel < levels.length - 1) {
                currentLevel++;
                loadLevel(currentLevel);
            }
        }

        // Initialize first level
        loadLevel(currentLevel);
    </script>
</body>
</html>
