<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/ch/ and /c/ Sound Sorting</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f7f9fa;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .instructions {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 20px;
        }

        .board {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
        }

        .drop-zone {
            width: 300px;
            min-height: 400px;
            background-color: white;
            border: 4px solid #333;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        /* Distinct border colors for /ch/ and /c/ to match the image */
        #sound-ch {
            border-color: #246b73; /* Teal */
            background-color: #c9e4e6;
        }
        
        #sound-c {
            border-color: #d67963; /* Coral */
            background-color: #f7d2c6;
        }

        .drop-zone h2 {
            font-size: 2em;
            margin: 10px 0 5px 0;
        }

        #sound-ch h2 {
            color: #246b73;
        }

        #sound-c h2 {
            color: #d67963;
        }

        .drop-zone p {
            margin: 0 0 20px 0;
            font-size: 1.2em;
            color: #444;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
            width: 80%;
        }

        /* Container for the items when dropped */
        .dropped-items {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .item-bank {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            min-height: 120px;
            padding: 20px;
            border: 3px dashed #aaa;
            border-radius: 20px;
            background-color: #fff;
            max-width: 800px;
            margin: 0 auto;
        }

        .draggable {
            width: 110px;
            height: 135px;
            background-color: white;
            border: 2px dashed #888;
            border-radius: 10px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .draggable:active {
            cursor: grabbing;
        }

        .draggable img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            pointer-events: none; /* Prevents dragging just the asset */
            margin-bottom: 5px;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake 0.5s;
            border-color: red !important;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .pop {
            animation: pop 0.5s;
            border-color: #4CAF50 !important;
            border-style: solid;
        }

        #play-again {
            display: none;
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.5em;
            font-family: inherit;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
            transition: transform 0.2s;
        }

        #play-again:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Sorting: /ch/ and /c/ Sounds</h1>
    <p class="instructions">Click a picture to hear the word. Drag and drop the pictures into the correct column!</p>

    <div class="board">
        <div class="drop-zone" id="sound-ch" data-target="ch">
            <h2>/ch/ sound</h2>
            <p>Words starting with<br>the /ch/ sound</p>
            <div class="dropped-items"></div>
        </div>

        <div class="drop-zone" id="sound-c" data-target="c">
            <h2>/c/ sound</h2>
            <p>Words starting with<br>the /c/ sound</p>
            <div class="dropped-items"></div>
        </div>
    </div>

    <div class="item-bank" id="item-bank">
        
        <div class="draggable" draggable="true" id="item-chair" data-type="ch">
            <img src="https://img.icons8.com/color/96/000000/chair.png" alt="chair">
            <span>chair</span>
        </div>

        <div class="draggable" draggable="true" id="item-cat" data-type="c">
            <img src="https://img.icons8.com/color/96/000000/cat.png" alt="cat">
            <span>cat</span>
        </div>

        <div class="draggable" draggable="true" id="item-cheese" data-type="ch">
            <img src="https://img.icons8.com/color/96/000000/cheese.png" alt="cheese">
            <span>cheese</span>
        </div>

        <div class="draggable" draggable="true" id="item-car" data-type="c">
            <img src="https://img.icons8.com/color/96/000000/car--v1.png" alt="car">
            <span>car</span>
        </div>

        <div class="draggable" draggable="true" id="item-chick" data-type="ch">
            <img src="https://api.iconify.design/noto:front-facing-baby-chick.svg" alt="chick">
            <span>chick</span>
        </div>

        <div class="draggable" draggable="true" id="item-cup" data-type="c">
            <img src="https://api.iconify.design/noto:teacup-without-handle.svg" alt="cup">
            <span>cup</span>
        </div>

    </div>

    <button id="play-again" onclick="resetGame()">Play Again!</button>

    <script>
        const draggables = document.querySelectorAll('.draggable');
        const dropZones = document.querySelectorAll('.drop-zone');
        const itemBank = document.getElementById('item-bank');
        const playAgainBtn = document.getElementById('play-again');
        let totalItems = draggables.length;
        let correctlyPlaced = 0;

        // --- Audio Setup ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playWrongSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }

        function speakWord(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9; 
            utterance.pitch = 1.2; 
            window.speechSynthesis.speak(utterance);
        }

        // --- Drag and Drop Logic ---
        draggables.forEach(draggable => {
            draggable.addEventListener('click', () => {
                const word = draggable.querySelector('span').innerText;
                speakWord(word);
            });

            draggable.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', draggable.id);
                draggable.classList.remove('shake', 'pop'); 
            });
        });

        dropZones.forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault(); 
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                const draggableId = e.dataTransfer.getData('text/plain');
                const draggableElement = document.getElementById(draggableId);
                const itemType = draggableElement.getAttribute('data-type');
                const zoneType = zone.getAttribute('data-target');

                if (itemType === zoneType) {
                    speakWord("Correct!");
                    zone.querySelector('.dropped-items').appendChild(draggableElement);
                    draggableElement.classList.add('pop');
                    draggableElement.setAttribute('draggable', 'false'); 
                    correctlyPlaced++;
                    checkWin();
                } else {
                    playWrongSound();
                    draggableElement.classList.add('shake');
                    
                    setTimeout(() => {
                        draggableElement.classList.remove('shake');
                    }, 500);
                }
            });
        });

        function checkWin() {
            if (correctlyPlaced === totalItems) {
                setTimeout(() => {
                    speakWord("Great job! You sorted all the words!");
                    playAgainBtn.style.display = "inline-block";
                }, 1000);
            }
        }

        function resetGame() {
            correctlyPlaced = 0;
            playAgainBtn.style.display = "none";
            
            draggables.forEach(draggable => {
                itemBank.appendChild(draggable);
                draggable.setAttribute('draggable', 'true');
                draggable.classList.remove('pop', 'shake');
            });
            
            // Randomize items in the bank
            for (let i = itemBank.children.length; i >= 0; i--) {
                itemBank.appendChild(itemBank.children[Math.random() * i | 0]);
            }
        }

        resetGame();
    </script>
</body>
</html>
