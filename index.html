<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short I and Long I Sorting</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        #page-indicator {
            font-size: 1.5em;
            color: #666;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .instructions {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 20px;
        }

        .board {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
        }

        .drop-zone {
            width: 300px;
            min-height: 400px;
            background-color: white;
            border: 4px solid #333;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        /* Distinct border colors matching the worksheet */
        #short-i {
            border-color: #d13076;
        }
        
        #long-i {
            border-color: #3cb4c6;
        }

        .drop-zone h2 {
            font-size: 2em;
            margin: 10px 0 5px 0;
        }

        #short-i h2 {
            color: #d13076;
        }

        #long-i h2 {
            color: #3cb4c6;
        }

        .drop-zone p {
            margin: 0 0 20px 0;
            font-size: 1.2em;
            color: #666;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
            width: 80%;
        }

        /* Container for the items when dropped */
        .dropped-items {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .item-bank {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            min-height: 120px;
            padding: 20px;
            border: 3px dashed #aaa;
            border-radius: 20px;
            background-color: #fff;
            max-width: 800px;
            margin: 0 auto;
        }

        .draggable {
            width: 100px;
            height: 120px;
            background-color: white;
            border: 2px dashed #888;
            border-radius: 10px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .draggable:active {
            cursor: grabbing;
        }

        .draggable img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            pointer-events: none; /* Prevents dragging just the image */
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake 0.5s;
            border-color: red !important;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .pop {
            animation: pop 0.5s;
            border-color: #4CAF50 !important;
            border-style: solid;
        }

        #action-btn {
            display: none;
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.5em;
            font-family: inherit;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
            transition: transform 0.2s;
        }

        #action-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Sorting: Short I and Long I</h1>
    <div id="page-indicator">Page 1 of 2</div>
    <p class="instructions">Click a picture to hear the word. Drag and drop the pictures into the correct column!</p>

    <div class="board">
        <div class="drop-zone" id="short-i" data-target="short">
            <h2>Short I</h2>
            <p>Words with the<br>short i sound</p>
            <div class="dropped-items"></div>
        </div>

        <div class="drop-zone" id="long-i" data-target="long">
            <h2>Long I</h2>
            <p>Words with the<br>long i sound</p>
            <div class="dropped-items"></div>
        </div>
    </div>

    <div class="item-bank" id="item-bank"></div>

    <button id="action-btn" onclick="handleActionClick()">Next Page!</button>

    <script>
        // Game Pages Data Configuration
        const gamePages = [
            // Page 1 Words
            [
                { id: "item-kit", word: "kit", type: "short", img: "kit.png" },
                { id: "item-kite", word: "kite", type: "long", img: "kite.png" },
                { id: "item-rip", word: "rip", type: "short", img: "rip.png" },
                { id: "item-ripe", word: "ripe", type: "long", img: "ripe.png" },
                { id: "item-light", word: "light", type: "long", img: "light.png" },
                { id: "item-sit", word: "sit", type: "short", img: "sit.png" }
            ],
            // Page 2 Words
            [
                { id: "item-tin", word: "tin", type: "short", img: "tin.png" },
                { id: "item-mice", word: "mice", type: "long", img: "mice.png" },
                { id: "item-lid", word: "lid", type: "short", img: "lid.png" },
                { id: "item-bike", word: "bike", type: "long", img: "bike.png" },
                { id: "item-pig", word: "pig", type: "short", img: "pig.png" },
                { id: "item-fire", word: "fire", type: "long", img: "fire.png" }
            ]
        ];

        let currentPageIndex = 0;
        let totalItems = 0;
        let correctlyPlaced = 0;

        const itemBank = document.getElementById('item-bank');
        const dropZones = document.querySelectorAll('.drop-zone');
        const actionBtn = document.getElementById('action-btn');
        const pageIndicator = document.getElementById('page-indicator');

        // --- Audio Setup ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playWrongSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }

        function speakWord(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9; 
            utterance.pitch = 1.2; 
            window.speechSynthesis.speak(utterance);
        }

        // --- Setup Page Level ---
        function loadPage(pageIndex) {
            // Reset counters
            correctlyPlaced = 0;
            actionBtn.style.display = "none";
            
            // Update Text Indicators
            pageIndicator.innerText = `Page ${pageIndex + 1} of ${gamePages.length}`;
            
            // Clear drop zones
            dropZones.forEach(zone => {
                zone.querySelector('.dropped-items').innerHTML = '';
            });

            // Clear and populate Item Bank
            itemBank.innerHTML = '';
            const currentWords = gamePages[pageIndex];
            totalItems = currentWords.length;

            // Generate items dynamically
            currentWords.forEach(item => {
                const element = document.createElement('div');
                element.className = 'draggable';
                element.setAttribute('draggable', 'true');
                element.id = item.id;
                element.setAttribute('data-type', item.type);

                element.innerHTML = `
                    <img src="${item.img}" alt="${item.word}">
                    <span>${item.word}</span>
                `;

                // Add Click Event to hear the word
                element.addEventListener('click', () => {
                    speakWord(item.word);
                });

                // Add Drag Start Event
                element.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', element.id);
                    element.classList.remove('shake', 'pop'); 
                });

                itemBank.appendChild(element);
            });

            // Randomize order inside the item bank
            for (let i = itemBank.children.length; i >= 0; i--) {
                itemBank.appendChild(itemBank.children[Math.random() * i | 0]);
            }
        }

        // --- Drag and Drop Logic ---
        dropZones.forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault(); 
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                const draggableId = e.dataTransfer.getData('text/plain');
                const draggableElement = document.getElementById(draggableId);
                
                if (!draggableElement) return;

                const itemType = draggableElement.getAttribute('data-type');
                const zoneType = zone.getAttribute('data-target');

                if (itemType === zoneType) {
                    // Correct Drop
                    speakWord("Correct!");
                    zone.querySelector('.dropped-items').appendChild(draggableElement);
                    draggableElement.classList.add('pop');
                    draggableElement.setAttribute('draggable', 'false'); // Lock it
                    correctlyPlaced++;
                    checkWin();
                } else {
                    // Wrong Drop
                    playWrongSound();
                    draggableElement.classList.add('shake');
                    
                    setTimeout(() => {
                        draggableElement.classList.remove('shake');
                    }, 500);
                }
            });
        });

        function checkWin() {
            if (correctlyPlaced === totalItems) {
                setTimeout(() => {
                    if (currentPageIndex < gamePages.length - 1) {
                        speakWord("Great job! You finished this page!");
                        actionBtn.innerText = "Next Page!";
                    } else {
                        speakWord("Great job! You sorted all the words!");
                        actionBtn.innerText = "Play Again!";
                    }
                    actionBtn.style.display = "inline-block";
                }, 1000);
            }
        }

        function handleActionClick() {
            if (currentPageIndex < gamePages.length - 1) {
                // Move to Page 2
                currentPageIndex++;
                loadPage(currentPageIndex);
            } else {
                // Reset back to Page 1
                currentPageIndex = 0;
                loadPage(currentPageIndex);
            }
        }

        // Initialize the game with the first page load
        loadPage(currentPageIndex);
    </script>
</body>
</html>
